<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Keuangan</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{margin:0;font-family:Arial;background:#f1f3f6}
.header{background:#28a745;color:#fff;padding:15px;text-align:center;font-weight:bold;position:sticky;top:0}
.container{padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input,select{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#28a745;color:#fff;font-size:15px}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#28a745;color:#fff;padding:8px}
td{padding:6px;border-bottom:1px solid #ddd;text-align:center}
.total-box{display:flex;gap:10px}
.total-item{flex:1;background:#fff;border-radius:12px;padding:12px;text-align:center}
.masuk{color:#28a745;font-weight:bold}
.keluar{color:#dc3545;font-weight:bold}
.filter-box{display:flex;gap:10px}
.btn-edit{padding:5px 8px;font-size:12px;background:#ffc107;color:#000;border-radius:6px}
.btn-hapus{padding:5px 8px;font-size:12px;background:#dc3545;color:#fff;border-radius:6px;margin-top:5px}
</style>
</head>

<body>

<div class="header">📒 Catatan Keuangan</div>

<div class="container">

<div class="card">
  <div class="filter-box">
    <select id="filterBulan"></select>
    <select id="filterTahun"></select>
  </div>
</div>

<div class="card">
  <input type="date" id="tanggal">

  <select id="jenis">
    <option value="">Pilih Jenis</option>
    <option value="Pemasukan">Pemasukan</option>
    <option value="Pengeluaran">Pengeluaran</option>
  </select>

  <div id="rtRwBox" class="hidden">
    <select id="rtRw"></select>
    <input type="text" id="rtRwBaru" placeholder="Tambah RT / RW">
    <button id="btnRTRW">➕ Simpan RT/RW</button>
  </div>

  <input type="number" id="nominal" placeholder="Nominal">
  <input type="text" id="detail" placeholder="Detail transaksi">
  <button id="btnSimpan">💾 Simpan Data</button>
</div>

<div class="total-box">
  <div class="total-item">
    <div>Total Pemasukan</div>
    <div class="masuk">Rp <span id="totalMasuk">0</span></div>
  </div>
  <div class="total-item">
    <div>Total Pengeluaran</div>
    <div class="keluar">Rp <span id="totalKeluar">0</span></div>
  </div>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Jenis</th>
<th>RT/RW</th>
<th>Nominal</th>
<th>Detail</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabelData"></tbody>
</table>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  doc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAF9a5qILTbVII0oilxcuFLxlbVgLjxnHI",
  authDomain: "unit-sampah.firebaseapp.com",
  projectId: "unit-sampah",
  storageBucket: "unit-sampah.firebasestorage.app",
  messagingSenderId: "268154438046",
  appId: "1:268154438046:web:9f74e7b6b57e01c739968f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tanggal = document.getElementById("tanggal");
const jenis = document.getElementById("jenis");
const rtRwBox = document.getElementById("rtRwBox");
const rtRw = document.getElementById("rtRw");
const rtRwBaru = document.getElementById("rtRwBaru");
const nominal = document.getElementById("nominal");
const detail = document.getElementById("detail");
const tabelData = document.getElementById("tabelData");
const totalMasuk = document.getElementById("totalMasuk");
const totalKeluar = document.getElementById("totalKeluar");
const filterBulan = document.getElementById("filterBulan");
const filterTahun = document.getElementById("filterTahun");
const btnSimpan = document.getElementById("btnSimpan");
const btnRTRW = document.getElementById("btnRTRW");

let semuaData=[];
let editId=null;

/* TANGGAL DEFAULT HARI INI */
tanggal.value=new Date().toISOString().split("T")[0];

/* BULAN */
const namaBulan=[
"01-Januari","02-Februari","03-Maret","04-April","05-Mei","06-Juni",
"07-Juli","08-Agustus","09-September","10-Oktober","11-November","12-Desember"
];
namaBulan.forEach(b=>{
  const v=b.split("-")[0];
  filterBulan.innerHTML+=`<option value="${v}">${b.split("-")[1]}</option>`;
});
filterBulan.value=String(new Date().getMonth()+1).padStart(2,"0");

jenis.onchange=()=>rtRwBox.classList.toggle("hidden",jenis.value!=="Pemasukan");

btnRTRW.onclick=async()=>{
  if(!rtRwBaru.value) return alert("Isi RT/RW");
  await addDoc(collection(db,"rtRw"),{nama:rtRwBaru.value});
  rtRwBaru.value="";
};

btnSimpan.onclick=async()=>{
  if(!tanggal.value||!jenis.value||!nominal.value) return alert("Lengkapi data");

  const data={
    tanggal:tanggal.value,
    jenis:jenis.value,
    rtRw:jenis.value==="Pemasukan"?rtRw.value:"-",
    nominal:Number(nominal.value),
    detail:detail.value
  };

  if(editId){
    await updateDoc(doc(db,"keuangan",editId),data);
    editId=null;
    btnSimpan.innerText="💾 Simpan Data";
  }else{
    await addDoc(collection(db,"keuangan"),data);
  }

  jenis.value=nominal.value=detail.value=rtRw.value="";
  rtRwBox.classList.add("hidden");
};

onSnapshot(collection(db,"rtRw"),s=>{
  rtRw.innerHTML="<option value=''>Pilih RT/RW</option>";
  s.forEach(d=>rtRw.innerHTML+=`<option>${d.data().nama}</option>`);
});

onSnapshot(collection(db,"keuangan"),s=>{
  semuaData=[];
  let tahun=new Set();
  s.forEach(d=>{
    let x=d.data(); x.id=d.id;
    semuaData.push(x);
    tahun.add(x.tanggal.slice(0,4));
  });
  filterTahun.innerHTML="";
  [...tahun].sort().reverse().forEach(t=>filterTahun.innerHTML+=`<option>${t}</option>`);
  filterTahun.value=String(new Date().getFullYear());
  render();
});

filterBulan.onchange=render;
filterTahun.onchange=render;

/* 🔥 AUTO URUT TANGGAL TRANSAKSI */
function render(){
  tabelData.innerHTML="";
  let m=0,k=0;

  semuaData
    .filter(d=>d.tanggal.slice(0,4)===filterTahun.value &&
               d.tanggal.slice(5,7)===filterBulan.value)
    .sort((a,b)=>new Date(a.tanggal)-new Date(b.tanggal))
    .forEach(d=>{
      tabelData.innerHTML+=`
      <tr>
        <td>${d.tanggal}</td>
        <td>${d.jenis}</td>
        <td>${d.rtRw}</td>
        <td>Rp ${d.nominal.toLocaleString("id-ID")}</td>
        <td>${d.detail}</td>
        <td>
          <button class="btn-edit" onclick="editData('${d.id}')">Edit</button>
          <button class="btn-hapus" onclick="hapusData('${d.id}')">Hapus</button>
        </td>
      </tr>`;
      d.jenis==="Pemasukan"?m+=d.nominal:k+=d.nominal;
    });

  totalMasuk.innerText=m.toLocaleString("id-ID");
  totalKeluar.innerText=k.toLocaleString("id-ID");
}

window.editData=id=>{
  const d=semuaData.find(x=>x.id===id);
  editId=id;
  tanggal.value=d.tanggal;
  jenis.value=d.jenis;
  nominal.value=d.nominal;
  detail.value=d.detail;
  if(d.jenis==="Pemasukan"){
    rtRwBox.classList.remove("hidden");
    rtRw.value=d.rtRw;
  }
  btnSimpan.innerText="🔄 Update Data";
};

window.hapusData=async id=>{
  if(confirm("Yakin hapus data ini?")){
    await deleteDoc(doc(db,"keuangan",id));
  }
};
</script>

</body>
</html>
